## preprocessing config: python3 scripts/preprocess.py --config configs/base.yaml
## training/evaluation use configs/step1*.yaml
data:
  raw_800m:
    path: /data/osea/s3-osea/Norkyst/avg
    location_name: norkyst
    resolution_tag: 800m
  raw_160m:
    path: /data/osea/s3-osea/Norfjords/A04_v3/avg
    location_name: norfjords
    resolution_tag: 160m

  processed_dir: data/processed

  input_vars: [u, v]                   # from 800m, reprojected onto the 160m grid
  target_vars: [u, v]                  # from 160m
  static_inputs: [bathymetry, land_mask, distance_to_coast]

  ## optional vertical level index into s_rho / s_w, e.g. levels: {temp: -1}
  ## variables not listed default to -1 (surface)
