# pyproject.toml
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "raid"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "xarray",
    "netCDF4",
    "numpy",
    "torch",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not data'"
markers = ["data: checks the full processed dataset on disk (run with `pytest -m data`)"]

[tool.setuptools.packages.find]
where = ["src"]
